[project]
name = "garmin-life-kit"
version = "1.0.0"
description = "Morning and evening recaps from your Garmin data, sent to Telegram. Report only."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "mcp>=2,<3",
]

[project.scripts]
garmin-life-mcp = "kit.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
